name: Deploy to EC2

on:
  push:
    branches: [ main ]   # deploy on pushes to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # App/runtime config (edit if needed)
      APP_NAME: sodsol-backend            # PM2 process name
      ENTRY_FILE: server.js               # Entry file (change if needed)
      APP_PORT: "4500"                    # Your Node app port

      # Release layout on server
      REMOTE_ROOT: /var/www/sodsol
      RELEASES_DIR: /var/www/sodsol/releases
      CURRENT_LINK: /var/www/sodsol/current

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          mkdir -p artifact
          # Package only what's needed on server; exclude VCS, node_modules, .env
          tar --exclude-vcs --exclude=node_modules --exclude=.env -czf artifact/release.tgz \
            package.json package-lock.json \
            server.js src dist public \
            ecosystem.config.js 2>/dev/null || true
          ls -lh artifact/release.tgz

      # Upload artifact to EC2 (robust scp action)
      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}         # public IP or public DNS
          username: ${{ secrets.EC2_USER }}     # ubuntu or ec2-user
          port: ${{ secrets.EC2_PORT || 22 }}
          key: ${{ secrets.EC2_SSH_KEY }}       # private key (PEM contents)
          source: "artifact/release.tgz"
          target: "/tmp"

      # Remote deploy (idempotent bootstrap + releases + PM2 + Nginx + optional SSL)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          port: ${{ secrets.EC2_PORT || 22 }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_NAME="${APP_NAME}"
            ENTRY_FILE="${ENTRY_FILE}"
            APP_PORT="${APP_PORT}"
            REMOTE_ROOT="${REMOTE_ROOT}"
            RELEASES_DIR="${RELEASES_DIR}"
            CURRENT_LINK="${CURRENT_LINK}"
            DOMAIN="${{ secrets.DOMAIN || '' }}"
            EMAIL="${{ secrets.EMAIL  || '' }}"

            # ---- System prep ----
            # Node & jq
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs build-essential jq
            else
              if ! command -v jq >/dev/null 2>&1; then
                sudo apt-get install -y jq
              fi
            fi

            # PM2
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm i -g pm2
            fi

            # Nginx (HTTP)
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            # Base HTTP vhost (needed for first-time cert issuance & HTTP-only)
            sudo bash -c "cat > /etc/nginx/sites-available/sodsol_http.conf" <<NGINX_HTTP
            server {
              listen 80 default_server;
              server_name _;

              location / {
                proxy_pass http://localhost:${APP_PORT};
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host \$host;
                proxy_cache_bypass \$http_upgrade;
              }
            }
            NGINX_HTTP

            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sf /etc/nginx/sites-available/sodsol_http.conf /etc/nginx/sites-enabled/sodsol_http.conf
            sudo nginx -t && sudo systemctl reload nginx

            # ---- Optional HTTPS with Certbot (if DOMAIN+EMAIL set) ----
            if [ -n "$DOMAIN" ] && [ -n "$EMAIL" ]; then
              if ! command -v certbot >/dev/null 2>&1; then
                sudo apt-get install -y certbot python3-certbot-nginx
              fi
              if [ ! -d "/etc/letsencrypt/live/$DOMAIN" ]; then
                sudo certbot --nginx --non-interactive --agree-tos --email "$EMAIL" -d "$DOMAIN"
              fi

              sudo bash -c "cat > /etc/nginx/sites-available/sodsol_https.conf" <<NGINX_HTTPS
              server {
                listen 80;
                server_name ${DOMAIN};
                return 301 https://\$host\$request_uri;
              }

              server {
                listen 443 ssl;
                server_name ${DOMAIN};

                ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

                location / {
                  proxy_pass http://localhost:${APP_PORT};
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host \$host;
                  proxy_cache_bypass \$http_upgrade;
                }
              }
              NGINX_HTTPS

              sudo ln -sf /etc/nginx/sites-available/sodsol_https.conf /etc/nginx/sites-enabled/sodsol_https.conf
              sudo nginx -t && sudo systemctl reload nginx

              # Auto-renew at 2am
              if ! sudo crontab -l 2>/dev/null | grep -q "certbot renew"; then
                (sudo crontab -l 2>/dev/null; echo "0 2 * * * certbot renew --quiet --deploy-hook 'systemctl reload nginx'") | sudo crontab -
              fi
            fi

            # ---- App deployment: releases + symlink + PM2 reload ----
            sudo mkdir -p "$RELEASES_DIR" "$REMOTE_ROOT"
            sudo chown -R "$USER:$USER" "$REMOTE_ROOT"

            TS="$(date +%Y%m%d%H%M%S)"
            NEW_RELEASE="$RELEASES_DIR/$TS"
            mkdir -p "$NEW_RELEASE"

            tar -xzf /tmp/release.tgz -C "$NEW_RELEASE"

            # Preserve .env from current if present
            if [ -L "$CURRENT_LINK" ] && [ -f "$CURRENT_LINK/.env" ] && [ ! -f "$NEW_RELEASE/.env" ]; then
              cp "$CURRENT_LINK/.env" "$NEW_RELEASE/.env"
            fi

            cd "$NEW_RELEASE"

            # Install prod deps deterministically
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            # Build if package.json has "build"
            if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
              npm run build
            fi

            # Switch 'current' atomically
            ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"

            # Start or reload with PM2
            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 reload "$APP_NAME"
            else
              pm2 start "$CURRENT_LINK/$ENTRY_FILE" --name "$APP_NAME"
            fi
            pm2 save

            echo "✅ Deployed release: $NEW_RELEASE (port: $APP_PORT, domain: ${DOMAIN:-none})"
