name: Deploy to EC2

on:
  push:
    branches:
      - development   # deploys when you push to 'development'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # ---- App/runtime config (adjust if needed) ----
      APP_NAME: "moneyline-backend"     # PM2 process name
      ENTRY_FILE: "server.js"           # Your Node entry (e.g., app.js, src/index.js)
      APP_PORT: "4500"                  # Node listens here; Nginx proxies to this

      # Release layout on server
      REMOTE_ROOT: "/var/www/moneyline"
      RELEASES_DIR: "/var/www/moneyline/releases"
      CURRENT_LINK: "/var/www/moneyline/current"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create a compact artifact (no git, no node_modules, no .env)
      - name: Create release archive
        run: |
          mkdir -p artifact
          tar --exclude-vcs --exclude=node_modules --exclude=.env -czf artifact/release.tgz \
            package.json package-lock.json \
            server.js src dist public \
            ecosystem.config.js 2>/dev/null || true
          ls -lh artifact/release.tgz

      # Load your private key into ssh-agent (uses EC2_SSH_KEY secret)
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Optional: print target to confirm formatting (no secrets exposed)
      - name: Print target (sanity check)
        run: echo "::notice:: Target='${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}'"

      - name: Upload artifact to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          scp -P "$EC2_PORT" -o StrictHostKeyChecking=no artifact/release.tgz \
            "$EC2_USER@$EC2_HOST:/tmp/release.tgz"

      - name: Deploy on EC2 (bootstrap + releases + PM2 + Nginx + optional SSL)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          DOMAIN: ${{ secrets.DOMAIN }}   # optional: e.g., api.moneylinebackend.co.uk
          EMAIL: ${{ secrets.EMAIL }}     # optional: certbot email
        run: |
          ssh -p "$EC2_PORT" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" <<'EOF'
            set -euo pipefail

            # ---- Vars from workflow env ----
            APP_NAME="${APP_NAME}"
            ENTRY_FILE="${ENTRY_FILE}"
            APP_PORT="${APP_PORT}"
            REMOTE_ROOT="${REMOTE_ROOT}"
            RELEASES_DIR="${RELEASES_DIR}"
            CURRENT_LINK="${CURRENT_LINK}"
            DOMAIN="${DOMAIN:-}"
            EMAIL="${EMAIL:-}"

            # ---- System prep (idempotent) ----
            # Node / jq
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs build-essential jq
            else
              if ! command -v jq >/dev/null 2>&1; then
                sudo apt-get install -y jq
              fi
            fi

            # PM2
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm i -g pm2
            fi

            # Nginx (HTTP)
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            # Base HTTP vhost (needed for initial certificate issuance and HTTP-only mode)
            sudo bash -c "cat > /etc/nginx/sites-available/moneyline_http.conf" <<NGINX_HTTP
            server {
              listen 80 default_server;
              server_name _;

              location / {
                proxy_pass http://localhost:${APP_PORT};
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host \$host;
                proxy_cache_bypass \$http_upgrade;
              }
            }
            NGINX_HTTP

            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sf /etc/nginx/sites-available/moneyline_http.conf /etc/nginx/sites-enabled/moneyline_http.conf
            sudo nginx -t && sudo systemctl reload nginx

            # Optional: HTTPS via Certbot if DOMAIN & EMAIL provided
            if [ -n "$DOMAIN" ] && [ -n "$EMAIL" ]; then
              if ! command -v certbot >/dev/null 2>&1; then
                sudo apt-get install -y certbot python3-certbot-nginx
              fi

              if [ ! -d "/etc/letsencrypt/live/${DOMAIN}" ]; then
                sudo certbot --nginx --non-interactive --agree-tos --email "$EMAIL" -d "$DOMAIN"
              fi

              sudo bash -c "cat > /etc/nginx/sites-available/moneyline_https.conf" <<NGINX_HTTPS
              server {
                listen 80;
                server_name ${DOMAIN};
                return 301 https://\$host\$request_uri;
              }

              server {
                listen 443 ssl;
                server_name ${DOMAIN};

                ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

                location / {
                  proxy_pass http://localhost:${APP_PORT};
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host \$host;
                  proxy_cache_bypass \$http_upgrade;
                }
              }
              NGINX_HTTPS

              sudo ln -sf /etc/nginx/sites-available/moneyline_https.conf /etc/nginx/sites-enabled/moneyline_https.conf
              sudo nginx -t && sudo systemctl reload nginx

              # Auto-renew daily at 2am
              if ! sudo crontab -l 2>/dev/null | grep -q "certbot renew"; then
                (sudo crontab -l 2>/dev/null; echo "0 2 * * * certbot renew --quiet --deploy-hook 'systemctl reload nginx'") | sudo crontab -
              fi
            fi

            # ---- App deployment: releases + symlink + PM2 reload ----
            sudo mkdir -p "$RELEASES_DIR"
            sudo mkdir -p "$REMOTE_ROOT"
            sudo chown -R "$USER":"$USER" "$REMOTE_ROOT"

            TS="$(date +%Y%m%d%H%M%S)"
            NEW_RELEASE="$RELEASES_DIR/$TS"
            mkdir -p "$NEW_RELEASE"

            # Unpack artifact
            tar -xzf /tmp/release.tgz -C "$NEW_RELEASE"

            # Preserve .env from current if present
            if [ -L "$CURRENT_LINK" ] && [ -f "$CURRENT_LINK/.env" ] && [ ! -f "$NEW_RELEASE/.env" ]; then
              cp "$CURRENT_LINK/.env" "$NEW_RELEASE/.env"
            fi

            cd "$NEW_RELEASE"

            # Install production deps deterministically
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            # Build if package.json has "build" script
            if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
              npm run build
            fi

            # Atomically switch 'current' symlink
            ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"

            # Start or reload app with PM2
            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 reload "$APP_NAME"
            else
              pm2 start "$CURRENT_LINK/$ENTRY_FILE" --name "$APP_NAME"
            fi
            pm2 save

            echo "✅ Deployed release: $NEW_RELEASE (port: $APP_PORT, domain: ${DOMAIN:-none})"
          EOF
